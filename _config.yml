# -------------------------------------------------
# Header UI options
# -------------------------------------------------
# Drives _includes/header.html. Mix and match freely.
header:
  layout: island          # island | full   (island = floating rounded pill)
  sticky: true              # stick to top on scroll
  blur: true                # frosted-glass backdrop
  brand: both               # both | logo | title
  show_icons: true          # Phosphor icons inside nav links
  dropdowns: true           # render item.children as a dropdown (supports nested children)
  megamenu: true            # items with `megamenu: true` + `groups:` open a large panel
  progress: true            # thin page/reading-progress bar along the navbar edge
  search: true              # search button (opens command palette, key: /)
  dark_toggle: true         # light/dark switch
  # Action order in the bar (left→right): search · theme · github star
  github:
    enabled: true
    repo: imswarnil/imswarnil.github.io   # owner/repo — live star count
    show_stars: true
  sponsor:
    enabled: false
    url: https://github.com/sponsors/imswarnil
    label: Sponsor
  cta:
    enabled: false
    label: Hire me
    url: /contact/

# Drives _includes/footer.html.
footer:
  layout: columns           # columns | minimal   ← switch footer style
  boxed: true               # true = wrap footer in a rounded island card
  tagline: "Engineering meets storytelling — built fast, cinematic, robust."
  show_details: true        # site details column (brand, location, email, social)
  show_collections: true    # collection cloud — icon pill per collection
  show_nav: true            # navigation_footer links
  nav_limit: 7              # cap the "Site" column so it doesn't grow tall
  show_legal: true          # navigation_legal links (privacy, terms)
  show_social: true
  newsletter:
    enabled: true
    action: ""              # form POST endpoint (Buttondown/Mailchimp/etc.) — fill in before going live
    placeholder: "you@email.com"

# Reading layout: narrower content column + right sidebar + optional ad rails.
layout:
  sidebar: true             # default: show the right sidebar on posts (per-page `sidebar:` overrides)
  ad_rails: true            # show sticky vertical ad rails on very wide screens (>=1500px)
  toc: true                 # generate a Table of Contents widget from h2/h3
# -------------------------------------------------
# Navigation (header & footer)
# - "sub" shows as subtitle in mobile cards
# - "children" renders as submenu (desktop + mobile)
# -------------------------------------------------
# Three menu shapes are demonstrated below:
#   • Work    → a simple one-level dropdown (item.children, flat)
#   • Library → a large grouped megamenu (megamenu: true + groups: + featured:)
#   • About   → a two-level nested dropdown (a child that has its own children)
navigation_header:
  - title: Home
    url: /
    icon: house
  - title: Blog
    url: /blog/
    icon: pen-nib
  # ── one-level dropdown ──
  - title: Work
    url: /projects/
    icon: rocket-launch
    children:
      - title: Projects
        url: /projects/
        icon: rocket-launch
      - title: Portfolio
        url: /portfolio/
        icon: images
      - title: Videos
        url: /videos/
        icon: video
  # ── large grouped megamenu ──
  - title: Library
    url: /snippets/
    icon: stack
    megamenu: true
    blurb: "Reusable code and AI prompts — copy, paste, and run."
    groups:
      - title: Code
        items:
          - title: Snippets
            url: /snippets/
            icon: code
            sub: Copy-paste code
          - title: SAQL windowing
            url: /snippets/saql-windowing/
            icon: function
            sub: Analytics recipe
      - title: AI
        items:
          - title: Prompts
            url: /prompts/
            icon: sparkle
            sub: Battle-tested prompts
          - title: PR review prompt
            url: /prompts/pr-review-prompt/
            icon: git-pull-request
            sub: Ship better reviews
    featured:
      title: Explore everything
      text: Every collection in one big bento grid.
      url: /explore/
      icon: squares-four
  # ── two-level nested dropdown ──
  - title: About
    url: /about/
    icon: user
    children:
      - title: About me
        url: /about/
        icon: user
      - title: Resume
        url: /resume/
        icon: identification-card
      - title: More
        icon: dots-three-outline
        children:
          - title: Now
            url: /now/
            icon: clock
          - title: Timeline
            url: /timeline/
            icon: clock-counter-clockwise
          - title: Contact
            url: /contact/
            icon: chat-circle

# Kept short on purpose — the footer caps this list (site.footer.nav_limit)
# so the "Site" column doesn't grow tall with every collection/page. The
# collection cloud already links every collection with an icon.
navigation_footer:
  - title: About
    url: /about/
  - title: Resume
    url: /resume/
  - title: Blog
    url: /blog/
  - title: Now
    url: /now/
  - title: Timeline
    url: /timeline/
  - title: Contact
    url: /contact/
  - title: Sitemap
    url: /sitemap/

# Legal / policy links — rendered in their own footer row.
navigation_legal:
  - title: Privacy Policy
    url: /privacy/
  - title: Terms of Use
    url: /terms/




