# 2. Content structure & collections
permalink: pretty                   # Permalink style (/YYYY/MM/DD/page-name/)
excerpt_separator: <!-- more -->    # Marks end of excerpt in posts

# Seven content-typed collections. Custom keys (singular / icon / image)
# are read by the IM card + JSON-LD includes. `image` is the collection's
# fallback cover used when an entry has no `image` of its own.
collections:
  posts:
    output: true
    title: Blog
    singular: Post
    description: "Essays, how-tos and field notes on engineering & craft."
    permalink: /blog/:title/
    landing: /blog/          # actual listing-page URL (permalink above is a per-doc pattern, not a link target)
    icon: pen-nib
    schema: BlogPosting
    style: numbered
    image: "/assets/img/covers/blog.svg"
  projects:
    output: true
    title: Projects
    singular: Project
    description: "Things I've designed, built and shipped."
    permalink: /projects/:name/
    landing: /projects/
    icon: rocket-launch
    schema: CreativeWork
    style: bento
    image: "/assets/img/covers/projects.svg"
  portfolio:
    output: true
    title: Portfolio
    singular: Work
    description: "Selected work — film, design and product."
    permalink: /portfolio/:name/
    landing: /portfolio/
    icon: images
    schema: CreativeWork
    style: gallery
    image: "/assets/img/covers/portfolio.svg"
  videos:
    output: true
    title: Videos
    singular: Video
    description: "Films, edits and video essays."
    permalink: /videos/:name/
    landing: /videos/
    icon: video
    schema: VideoObject
    style: featured
    image: "/assets/img/covers/videos.svg"
  snippets:
    output: true
    title: Snippets
    singular: Snippet
    description: "Short, copy-pasteable code snippets and TILs."
    permalink: /snippets/:name/
    landing: /snippets/
    icon: code
    schema: TechArticle
    style: compact
    image: "/assets/img/covers/snippets.svg"
  prompts:
    output: true
    title: Prompts
    singular: Prompt
    description: "Battle-tested AI prompts you can copy and run."
    permalink: /prompts/:name/
    landing: /prompts/
    icon: sparkle
    schema: CreativeWork
    style: cards
    image: "/assets/img/covers/prompts.svg"

# Site-wide ultimate fallback image (used by SEO + cards as last resort)
placeholder_image: "/assets/img/placeholder.svg"

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/img/placeholder.svg"   # default social/share image
      layout: post                            # every collection entry → post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page                            # standalone pages → page

# 3. Plugins & gem settings
plugins:
  - jekyll-sitemap
  - jekyll-mentions
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-commonmark
  - jekyll-include-cache
  - jemoji

# jekyll-paginate-v2 — paginates the blog collection listing
pagination:
  enabled: true
  collection: posts
  per_page: 6
  permalink: "/page/:num/"
  sort_field: "date"
  sort_reverse: true

jekyll-mentions: https://twitter.com # jekyll-mentions > @reply service

twitter:                            # jekyll-seo-tag > Twitter config
  username: imswarnil
author: Swarnil Singhai                 # jekyll-seo-tag > default author

social:                             # jekyll-seo-tag > social overrides
  name: Swarnil Singhai             # Real name
  links:                            # sameAs list
    - https://twitter.com/imswarnil
    - https://www.facebook.com/imswarnil
    - https://www.linkedin.com/in/Swarnil-Singhai
    - https://github.com/imswarnil

