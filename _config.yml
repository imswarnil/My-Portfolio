# 5. Build & tooling
css_inline: false               # Inline all CSS into <head> if true

sass:
  quiet_deps: true

# Files excluded from Jekyll builds
exclude:
  - README.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - screenshot.png
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - alembic-jekyll-theme.gemspec
  - .jekyll-cache
  - bin
  - vendor
# NOTE: CNAME must NOT be excluded — Jekyll needs to copy it into _site so the
# GitHub Pages (Actions) deploy keeps the custom domain (dev.imswarnil.com).
